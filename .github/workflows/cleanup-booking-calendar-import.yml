name: Cleanup Booking Calendar import helpers

on:
  push:
    branches:
      - auto/booking-calendar-russian-release-candidate
    paths:
      - .github/workflows/cleanup-booking-calendar-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/booking-calendar-russian-release-candidate
          fetch-depth: 0
      - name: Remove one-time import workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/import-booking-calendar-russian-rc.yml \
            .github/workflows/import-booking-calendar-russian-rc-v2.yml \
            .github/workflows/cleanup-booking-calendar-import.yml
          git config user.name 'auto-company-delivery'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove one-time Booking Calendar import workflows'
          git push origin HEAD:auto/booking-calendar-russian-release-candidate
